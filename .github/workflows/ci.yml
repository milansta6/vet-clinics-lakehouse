name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (needed by Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Delta Lake jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2
          key: ivy-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: python -m pytest

  pipeline-smoke-test:
    name: Run the full pipeline (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      # --offline: use the cached FX sample, so CI does not depend on an external API.
      - name: generate -> bronze -> silver -> gold -> dq
        run: python -m vet_lakehouse.pipeline run --reset --offline --days 14
      - name: Incremental run (one more week)
        run: python -m vet_lakehouse.pipeline run --offline --days 21

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
