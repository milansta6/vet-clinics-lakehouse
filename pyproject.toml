[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vet-clinics-lakehouse"
version = "0.1.0"
description = "Medallion (Bronze / Silver / Gold) lakehouse for a fictional European veterinary clinic group. Runs locally on PySpark + Delta and on Databricks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.3,<3.6",
    "delta-spark>=3.2,<3.4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks use the injected globals `spark` and `dbutils`
# and need a sys.path tweak before importing the package.
"notebooks/*.py" = ["F821", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "e2e: runs the whole pipeline end to end (slower)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
