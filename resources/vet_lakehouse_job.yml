# Workflow job: setup -> bronze -> silver -> gold -> dq
#
# No cluster is defined on purpose: the notebook tasks then run on serverless
# compute, which is the only compute type on Databricks Free Edition.
# Job parameters are passed to every notebook as widgets.
resources:
  jobs:
    vet_lakehouse_pipeline:
      name: vet-clinics-lakehouse-pipeline
      description: Medallion pipeline for the fictional vet clinic group (bronze -> silver -> gold -> dq).
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: days
          default: ${var.days}

      # Daily at 05:00. Paused by default so nothing runs (or costs money) by accident.
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: Europe/Brussels
        pause_status: PAUSED

      tasks:
        - task_key: setup_and_generate
          description: Create schemas and the landing volume, generate the source files.
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_generate.py

        - task_key: bronze
          description: Incremental, append-only load of raw files.
          depends_on:
            - task_key: setup_and_generate
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py

        - task_key: silver
          description: Clean, deduplicate, convert to EUR, MERGE, quarantine bad rows.
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver.py

        - task_key: gold
          description: Star schema and aggregates for Power BI.
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold.py

        - task_key: dq
          description: Data quality checks. Fails the job when a blocking check fails.
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/04_data_quality.py
